name: Curated catalog approval
run-name: Curated catalog ${{ inputs.operation }} - ${{ inputs.verification_run_id || inputs.release_id || 'renewal' }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Maintainer-reviewed catalog operation
        required: true
        type: choice
        options: [approve, withdraw, renew]
      verification_run_id:
        description: Successful private curated verification run (approve only)
        required: false
        type: string
      release_id:
        description: Existing release to withdraw (withdraw only)
        required: false
        type: string
      review_note:
        description: Source provenance, distribution rights, unattended arguments and lifecycle review; or renewal/withdrawal rationale
        required: true
        type: string
      unsigned_exception:
        description: Explicit reviewed unsigned-installer exception (7-Zip only)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: curated-catalog-approval
  cancel-in-progress: false
  queue: max

env:
  CURATED_OPERATION: ${{ inputs.operation }}
  CURATED_VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
  CURATED_RELEASE_ID: ${{ inputs.release_id }}
  CURATED_REVIEW_NOTE: ${{ inputs.review_note }}
  CURATED_UNSIGNED_EXCEPTION: ${{ inputs.unsigned_exception }}

jobs:
  review:
    if: github.actor == 'ugurkocde' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-curated-runtime.mjs
      - name: Authenticate upstream evidence and prepare the maintainer review
        env:
          # Existing repository automation credential can read the private QA
          # repository. Prefer a dedicated read-only credential when supplied.
          GH_TOKEN: ${{ secrets.CURATED_QA_READ_TOKEN || secrets.PAT }}
        run: node scripts/curated-approval.mjs prepare
      - name: Show the concrete release and evidence awaiting review
        run: |
          echo 'Review publisher provenance, distribution rights, arguments, signature and all lifecycle phases before approving the signing environment.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat output/curated/approval/review.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: curated-maintainer-review
          path: output/curated/approval/review.json
          retention-days: 90
          if-no-files-found: error

  sign:
    needs: review
    environment: curated-catalog-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-curated-runtime.mjs
      - name: Revalidate evidence and sign after the required maintainer approval
        env:
          GH_TOKEN: ${{ secrets.CURATED_QA_READ_TOKEN || secrets.PAT }}
          CURATED_CATALOG_SIGNING_KEY: ${{ secrets.CURATED_CATALOG_SIGNING_KEY }}
        run: node scripts/curated-approval.mjs sign
      - uses: actions/upload-artifact@v4
        with:
          name: curated-approved-catalog
          path: |
            output/curated/approval/signed-catalog.json
            output/curated/approval/evidence.json
          retention-days: 90
          if-no-files-found: error
      - name: Publication instruction
        run: echo 'Signed review artifact ready. Commit the catalog and public evidence through a website PR, run required checks, and publish after review.' >> "$GITHUB_STEP_SUMMARY"

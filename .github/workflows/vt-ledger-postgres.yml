name: VirusTotal PostgreSQL contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17@sha256:3cec7eb015ba8adb28139fa5c83b8489cdf0e666e53dfdf20f598ae0cc8739e3
        env:
          POSTGRES_PASSWORD: synthetic-contract-test-only
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check concurrent ledger and caller boundaries
        env:
          PG_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 scripts/qa-automation/vt-ledger-postgres.test.py

name: Curated catalog discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

concurrency:
  group: curated-catalog-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Read vendor release metadata
        run: node scripts/curated-catalog.mjs discover --output output/curated/discovery.json
      - name: Check source availability, changed payloads and approval expiry
        if: always()
        run: node scripts/curated-monitor.mjs
      - name: Preserve candidates and source errors for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: curated-catalog-candidates
          path: |
            output/curated/discovery.json
            output/curated/monitor.json
          retention-days: 14
          if-no-files-found: error

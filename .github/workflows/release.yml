name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ugurkocde/intuneget

jobs:
  prepare:
    name: Validate release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag, package version, and release notes
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF#refs/tags/}
          version=${tag#v}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          package_version=$(jq -r .version package.json)
          if [[ "$package_version" != "$version" ]]; then
            echo "Tag $tag does not match package.json version $package_version" >&2
            exit 1
          fi
          notes="release-notes/${tag}.md"
          if [[ ! -s "$notes" ]]; then
            echo "Missing substantive release notes: $notes" >&2
            echo "Add user-facing features, fixes, operational impact, upgrade notes, and known limitations before tagging." >&2
            exit 1
          fi
          prerelease=false
          [[ "$version" =~ (alpha|beta|rc) ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Refuse an already published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "ugurkocde/IntuneGet" ]] || { echo "Unexpected release repository" >&2; exit 1; }
          tag="$TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag" >&2; exit 1; }
          error_file="$RUNNER_TEMP/release-guard-error"
          output_file="$RUNNER_TEMP/release-guard-output"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft >"$output_file" 2>"$error_file"; then
            [[ ! -s "$error_file" ]] || { cat "$error_file" >&2; exit 1; }
            if printf 'false\n' | cmp -s - "$output_file"; then
              echo "Release $tag is already published; refusing to rebuild mutable artifacts for an immutable tag." >&2
              exit 1
            elif printf 'true\n' | cmp -s - "$output_file"; then
              echo "No published release observed for $tag; no release object will be changed."
            else
              echo "Unexpected release visibility response" >&2
              exit 1
            fi
          else
            status=$?
            if [[ "$status" == "1" && ! -s "$output_file" ]] && printf 'release not found\n' | cmp -s - "$error_file"; then
              echo "No published release observed for $tag; no release object will be changed."
            else
              cat "$error_file" >&2
              exit 1
            fi
          fi

  docker:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform name
        shell: bash
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          provenance: mode=max
          sbom: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder
            NEXT_PUBLIC_AZURE_AD_CLIENT_ID=placeholder

      - name: Export digest
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest=${{ steps.build.outputs.digest }}
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and push manifest
    needs: [prepare, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag

      - name: Create manifest list and push
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --metadata-file "$RUNNER_TEMP/release-manifest.json" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
          digest=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/release-manifest.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}

  verify:
    name: Verify SQLite (${{ matrix.platform }})
    needs: [prepare, merge]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve exact published images
        env:
          RELEASE_DIGEST: ${{ needs.merge.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME@$RELEASE_DIGEST"
          docker buildx imagetools inspect "$image" --raw | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture] |
            contains(["amd64", "arm64"])' >/dev/null
          baseline_digest=$(docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:0.7.1" \
            --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$baseline_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          baseline="$REGISTRY/$IMAGE_NAME@$baseline_digest"
          docker pull "$image"
          docker pull "$baseline"
          echo "RELEASE_IMAGE=$image" >> "$GITHUB_ENV"
          echo "BASELINE_IMAGE=$baseline" >> "$GITHUB_ENV"
      - name: Verify fresh SQLite volume and recreation
        run: bash scripts/ci/verify-docker-sqlite.sh "$RELEASE_IMAGE"
      - name: Verify v0.7.1 SQLite upgrade and preserved completed job
        run: bash scripts/ci/verify-docker-sqlite.sh "$RELEASE_IMAGE" "$BASELINE_IMAGE"

  secure:
    name: Scan and sign image
    needs: [prepare, merge, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.merge.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign release image with GitHub OIDC
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.merge.outputs.digest }}

  promote:
    name: Promote verified stable image
    needs: [prepare, merge, secure]
    if: needs.prepare.outputs.prerelease != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote aliases from the verified digest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_DIGEST: ${{ needs.merge.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          major=${VERSION%%.*}
          minor=${VERSION%.*}
          docker buildx imagetools create --prefer-index=false \
            -t "$image:latest" -t "$image:$minor" -t "$image:$major" "$image@$RELEASE_DIGEST"

  release-gates:
    name: Confirm release artifact gates
    needs: [prepare, merge, secure, promote]
    if: >-
      !cancelled() && needs.secure.result == 'success' &&
      (needs.promote.result == 'success' ||
       (needs.prepare.outputs.prerelease == 'true' && needs.promote.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Report the verified image digest
        env:
          RELEASE_DIGEST: ${{ needs.merge.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid release digest" >&2; exit 1; }
          echo "RELEASE_DIGEST=$RELEASE_DIGEST"

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.5.0"

jobs:
  docker-changes:
    name: Docker input changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Docker inputs
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- Dockerfile .dockerignore docker-compose.yml .github/workflows/ci.yml 'lib/db/sqlite*' app/api/health; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [[ "$result" != 1 ]]; then exit "$result"; fi
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.1"
          cache: false

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= -ignore='unexpected key "queue" for "concurrency" section'

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Validate public changelog entries
        run: node scripts/publish-changelog.mjs --validate

      - name: Validate curated definitions and the standalone QA profile runtime
        run: |
          npm run curated:validate
          node scripts/build-curated-runtime.mjs
          node --check scripts/curated-automation.mjs

      - name: Build packager
        working-directory: packager
        run: |
          npm ci --no-audit --no-fund
          npm run build

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_AZURE_AD_CLIENT_ID: placeholder

  docker:
    name: Docker build and smoke test
    needs: docker-changes
    # Docker inputs are tested before merge. Other PRs keep the fast CI path;
    # every main push still builds, scans, and smoke-tests the complete image.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.docker-changes.outputs.changed == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: intuneget:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder
            NEXT_PUBLIC_AZURE_AD_CLIENT_ID=placeholder

      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: intuneget:test
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --publish 3000:3000 intuneget:test)
          trap 'docker logs "$container_id"; docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify SQLite volume initialization and persistence
        shell: bash
        run: |
          set -euo pipefail
          volume="intuneget-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_id=''
          cleanup() {
            if [[ -n "$container_id" ]]; then
              docker logs "$container_id" || true
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          start_container() {
            container_id=$(docker run --detach --publish 127.0.0.1:3001:3000 \
              --env DATABASE_MODE=sqlite --env DATABASE_PATH=/data/intuneget.db \
              --env PACKAGER_MODE=local --mount "type=volume,source=$volume,target=/data" intuneget:test)
            for _ in {1..30}; do
              if health=$(curl --silent --show-error --max-time 5 http://127.0.0.1:3001/api/health) \
                && jq --exit-status '.databaseMode == "sqlite" and .services.database == true' <<< "$health" >/dev/null; then
                return 0
              fi
              sleep 2
            done
            echo 'SQLite database did not become available on the test volume' >&2
            return 1
          }
          start_container
          test "$(docker exec "$container_id" id -u)" = 1001
          test "$(docker exec "$container_id" stat -c '%u:%g' /data)" = '1001:1001'
          docker exec "$container_id" node -e '
            const Database = require("better-sqlite3");
            const db = new Database(process.env.DATABASE_PATH);
            db.exec("CREATE TABLE intuneget_ci_volume_probe (value TEXT NOT NULL)");
            db.prepare("INSERT INTO intuneget_ci_volume_probe VALUES (?)").run("persisted");
            db.close();
          '
          docker rm --force "$container_id" >/dev/null
          container_id=''
          start_container
          docker exec "$container_id" node -e '
            const Database = require("better-sqlite3");
            const db = new Database(process.env.DATABASE_PATH);
            const row = db.prepare("SELECT value FROM intuneget_ci_volume_probe").get();
            db.close();
            if (row?.value !== "persisted") throw new Error("SQLite data did not survive container recreation");
          '

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.5.0"

jobs:
  docker-changes:
    name: Docker input changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Docker inputs
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- Dockerfile .dockerignore docker-compose.yml .github/workflows/ci.yml package.json package-lock.json next.config.js lib/db/index.ts scripts/ci/verify-docker-sqlite.sh 'lib/db/sqlite*' app/api/health; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [[ "$result" != 1 ]]; then exit "$result"; fi
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.1"
          cache: false

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= -ignore='unexpected key "queue" for "concurrency" section'

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Validate public changelog entries
        run: node scripts/publish-changelog.mjs --validate

      - name: Validate curated definitions and the standalone QA profile runtime
        run: |
          npm run curated:validate
          node scripts/build-curated-runtime.mjs
          node --check scripts/curated-automation.mjs

      - name: Build packager
        working-directory: packager
        run: |
          npm ci --no-audit --no-fund
          npm run build

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_AZURE_AD_CLIENT_ID: placeholder

  docker:
    name: Docker build and smoke test
    needs: docker-changes
    # Docker configuration, dependency and SQLite inputs are tested before merge.
    # Other PRs keep the normal CI path;
    # every main push still builds, scans, and smoke-tests the complete image.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.docker-changes.outputs.changed == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: intuneget:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder
            NEXT_PUBLIC_AZURE_AD_CLIENT_ID=placeholder

      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: intuneget:test
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --publish 3000:3000 intuneget:test)
          trap 'docker logs "$container_id"; docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify SQLite volume initialization and persistence
        shell: bash
        run: bash scripts/ci/verify-docker-sqlite.sh intuneget:test

      - name: Verify v0.7.1 SQLite upgrade and preserved completed job
        shell: bash
        run: |
          set -euo pipefail
          baseline_digest=$(docker buildx imagetools inspect ghcr.io/ugurkocde/intuneget:0.7.1 \
            --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$baseline_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          baseline="ghcr.io/ugurkocde/intuneget@$baseline_digest"
          docker pull "$baseline"
          bash scripts/ci/verify-docker-sqlite.sh intuneget:test "$baseline"
